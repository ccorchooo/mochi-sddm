[General]
# Wallpaper: path relative to the theme folder, or absolute (must be readable by the sddm user)
background=backgrounds/default.jpg

# ---- Material You colors ----
# Leave accentColor empty to extract the seed color from the wallpaper.
accentColor=
# tonalspot | vibrant | expressive | fidelity | neutral | monochrome
colorVariant=tonalspot
# dark | light
colorMode=dark

# ---- Clock ----
# flex | squishy | mono | dots | serif | thin | wide   (click the clock to cycle)
clockStyle=flex
# Comma-separated subset to cycle through (empty = all)
clockStyles=
# 24h | 12h
clockFormat=24h
showStyleButton=true

# ---- Top-left ----
# Qt date format (keep the quotes if it contains a comma), e.g. "ddd, MMM d"
dateFormat="dddd, MMMM d"
showHostname=true

# ---- Login ----
# cookie | flower | circle | squircle
avatarShape=cookie
# seconds before returning to the lock screen when the password is empty (0 = never)
idleTimeout=30

# ---- Look & motion ----
# wallpaper dimming 0..1, blur 0..1 when the login card is open
dimLevel=0.28
blur=1.0
# >1 faster, <1 slower
animationSpeed=1.0
# override the UI font family (empty = Google Sans Flex / fallback)
font=
